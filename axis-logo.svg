<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Цветовые градиенты -->
    <radialGradient id="bgDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe29d"/>
      <stop offset="30%" stop-color="#c5a059"/>
      <stop offset="70%" stop-color="#8a6d3b"/>
      <stop offset="100%" stop-color="#e2c17c"/>
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfb76c" stop-opacity="1"/>
      <stop offset="50%" stop-color="#c5a059" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#dfb76c" stop-opacity="1"/>
    </linearGradient>

    <!-- Эффекты свечения -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .spin-clockwise {
      animation: spin 16s linear infinite;
      transform-origin: 256px 256px;
    }
    .spin-counter {
      animation: spin-reverse 10s linear infinite;
      transform-origin: 256px 256px;
    }
    .pulse-core {
      animation: pulse 2s ease-in-out infinite alternate;
      transform-origin: 256px 256px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.8; }
      100% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 12px #dfb76c); }
    }
  </style>

  <!-- Фон -->
  <circle cx="256" cy="256" r="256" fill="url(#bgDark)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#232328" stroke-width="2"/>

  <!-- Внешний вращающийся маховик (Flywheel Outer) -->
  <g class="spin-clockwise">
    <circle cx="256" cy="256" r="185" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-dasharray="120 40 80 40"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke="#c5a059" stroke-width="1" stroke-dasharray="6 12" opacity="0.5"/>
    <polygon points="256,61 262,75 250,75" fill="#dfb76c"/>
    <polygon points="256,451 262,437 250,437" fill="#dfb76c"/>
  </g>

  <!-- Внутренний противовращающийся контур (Inner Flywheel) -->
  <g class="spin-counter">
    <circle cx="256" cy="256" r="145" fill="none" stroke="url(#goldMetallic)" stroke-width="3" stroke-dasharray="200 60" opacity="0.7" filter="url(#glow)"/>
    <circle cx="256" cy="111" r="4" fill="#dfb76c"/>
    <circle cx="256" cy="401" r="4" fill="#dfb76c"/>
  </g>

  <!-- Центральное ядро AXIS (Пульсирующая A-геометрия) -->
  <g class="pulse-core">
    <!-- Левая грань 'A' -->
    <path d="M 256 120 L 150 360 L 195 360 L 256 220 Z" fill="url(#goldMetallic)" filter="url(#glow)"/>
    
    <!-- Правая грань 'A' -->
    <path d="M 256 120 L 362 360 L 317 360 L 256 220 Z" fill="url(#goldMetallic)" opacity="0.85"/>
    
    <!-- Внутренний инвертированный срез (Ось / Перемычка) -->
    <polygon points="175,295 337,295 317,315 195,315" fill="#ffe29d"/>
    
    <!-- Реактор центра -->
    <circle cx="256" cy="220" r="9" fill="#070708"/>
    <circle cx="256" cy="220" r="5" fill="#dfb76c" filter="url(#glow)"/>
  </g>
</svg>
