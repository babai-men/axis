<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIS Protocol | Autonomous Volume Flywheel</title>
    <!-- Solana Web3 SDK -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0b;
            --card-bg: #131316;
            --accent-gold: #c5a059;
            --accent-gold-hover: #e5c079;
            --text-main: #f0f0f0;
            --text-muted: #71717a;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--accent-gold);
        }

        .btn-connect {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
        }

        .card.full {
            grid-column: span 2;
        }

        .card-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .card-value.gold {
            color: var(--accent-gold);
        }

        .btn-harvest {
            width: 100%;
            background: var(--accent-gold);
            border: none;
            color: #000;
            padding: 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-harvest:hover {
            background: var(--accent-gold-hover);
        }

        .btn-harvest:disabled {
            background: #27272a;
            color: #52525b;
            cursor: not-allowed;
        }

        .status {
            margin-top: 14px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            min-height: 18px;
        }

        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">$AXIS</div>
        <button id="connectBtn" class="btn-connect" onclick="connectWallet()">Connect Wallet</button>
    </div>

    <div class="dashboard">
        <div class="card full">
            <div class="card-label">Накоплено налога к сбору (Vault)</div>
            <div id="vaultBalance" class="card-value gold">0.00 $AXIS</div>
        </div>
        <div class="card">
            <div class="card-label">Твой Bounty (10%)</div>
            <div id="bountyAmount" class="card-value">0.00</div>
        </div>
        <div class="card">
            <div class="card-label">Сгорает (60%)</div>
            <div id="burnAmount" class="card-value">0.00</div>
        </div>
    </div>

    <button id="harvestBtn" class="btn-harvest" onclick="executeHarvest()" disabled>Собрать налог и сожечь</button>
    <div id="statusMessage" class="status">Подключите кошелек</div>

    <div class="footer">
        <a href="https://solscan.io" target="_blank">Solscan</a>
        <a href="https://app.meteora.ag" target="_blank">Meteora DLMM</a>
        <a href="https://dexscreener.com" target="_blank">DexScreener</a>
    </div>
</div>

<script>
    // =========================================================
    // КОНФИГУРАЦИЯ СМАРТ-КОНТРАКТА И RPC
    // =========================================================
    const RPC_ENDPOINT = "https://api.mainnet-beta.solana.com"; 
    const PROGRAM_ID = new solanaWeb3.PublicKey("GearSimpleCrank11111111111111111111111111111");
    const MINT_ADDRESS = new solanaWeb3.PublicKey("ВАШ_MINT_ADDRESS_AXIS");
    const VAULT_TOKEN_ACCOUNT = new solanaWeb3.PublicKey("ВАШ_VAULT_TOKEN_ACCOUNT");
    const DEV_TREASURY = new solanaWeb3.PublicKey("ВАШ_DEV_TREASURY_PUBKEY");

    const connection = new solanaWeb3.Connection(RPC_ENDPOINT, "confirmed");
    let walletPubKey = null;

    async function connectWallet() {
        if ("solana" in window) {
            try {
                const response = await window.solana.connect();
                walletPubKey = response.publicKey;
                const base58 = walletPubKey.toBase58();
                document.getElementById("connectBtn").innerText = base58.slice(0, 4) + "..." + base58.slice(-4);
                document.getElementById("statusMessage").innerText = "Кошелек подключен";
                fetchVaultBalance();
            } catch (err) {
                document.getElementById("statusMessage").innerText = "Ошибка: " + err.message;
            }
        } else {
            alert("Кошелек Solana не найден (Phantom / Solflare).");
        }
    }

    async function fetchVaultBalance() {
        try {
            const balanceData = await connection.getTokenAccountBalance(VAULT_TOKEN_ACCOUNT);
            const total = balanceData.value.uiAmount || 0;

            document.getElementById("vaultBalance").innerText = total.toLocaleString() + " $AXIS";
            document.getElementById("bountyAmount").innerText = (total * 0.10).toLocaleString();
            document.getElementById("burnAmount").innerText = (total * 0.60).toLocaleString();

            if (total > 0 && walletPubKey) {
                document.getElementById("harvestBtn").disabled = false;
            } else {
                document.getElementById("harvestBtn").disabled = true;
            }
        } catch (err) {
            document.getElementById("statusMessage").innerText = "Ошибка загрузки баланса Vault";
        }
    }

    async function executeHarvest() {
        if (!walletPubKey) return;

        document.getElementById("harvestBtn").disabled = true;
        document.getElementById("statusMessage").innerText = "Подтвердите транзакцию в кошельке...";

        try {
            // Anchor instruction discriminator (process_fees)
            const instructionData = Buffer.from([155, 234, 112, 45, 120, 19, 88, 102]); 

            const keys = [
                { pubkey: MINT_ADDRESS, isSigner: false, isWritable: false },
                { pubkey: VAULT_TOKEN_ACCOUNT, isSigner: false, isWritable: true },
                { pubkey: walletPubKey, isSigner: false, isWritable: false }, // Vault PDA Authority
                { pubkey: DEV_TREASURY, isSigner: false, isWritable: true },
                { pubkey: walletPubKey, isSigner: false, isWritable: true }, // Caller ATA
                { pubkey: new solanaWeb3.PublicKey("TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"), isSigner: false, isWritable: false }
            ];

            const ix = new solanaWeb3.TransactionInstruction({
                keys,
                programId: PROGRAM_ID,
                data: instructionData,
            });

            const tx = new solanaWeb3.Transaction().add(ix);
            tx.feePayer = walletPubKey;
            tx.recentBlockhash = (await connection.getLatestBlockhash()).blockhash;

            const signedTx = await window.solana.signAndSendTransaction(tx);
            document.getElementById("statusMessage").innerText = "Успешно! Tx: " + signedTx.signature.slice(0, 8) + "...";
            
            setTimeout(fetchVaultBalance, 3000);
        } catch (err) {
            document.getElementById("statusMessage").innerText = "Ошибка: " + err.message;
            document.getElementById("harvestBtn").disabled = false;
        }
    }

    // Автоматический опрос состояния каждые 8 секунд
    setInterval(fetchVaultBalance, 8000);
</script>

</body>
</html>
